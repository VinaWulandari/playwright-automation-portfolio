name: Playwright CI with Email Attachment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Run Playwright tests with HTML reporter
      - name: Run Playwright tests
        run: npx playwright test --reporter=html

      # 5️⃣ Zip entire report folder
      - name: Zip Playwright report
        run: zip -r playwright-report.zip playwright-report

      # 6️⃣ Send email with report attachment
      - name: Send Email with report attachment
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "Playwright Test Report"
          to: testing.vinaw@gmail.com
          body: "Playwright tests finished! See attached report."
          secure: true
          attachments: playwright-report.zip