name: Playwright Tests CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # paksa actions pakai Node.js 24

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3.3.0

      # 2. Setup Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v3.12.0
        with:
          node-version: 24
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Run Playwright tests with HTML report
      - name: Run Playwright tests
        run: npx playwright test --reporter=html

      # 5. Upload report as artifact (optional)
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/

      # 6. Send report via email
      - name: Send email with report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}        # Email pengirim
          password: ${{ secrets.EMAIL_APP_PASSWORD }} # App password Gmail
          subject: "Playwright Test Report"
          body: "Playwright test finished! Download the report attached."
          to: "testing.vinaw@gmail.com"
          attachments: "playwright-report/*"
