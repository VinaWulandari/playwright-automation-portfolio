name: Playwright + Allure CI with Artifact Link

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Install Playwright Browsers
      - name: Install Playwright Browsers
        run: npx playwright install

      - name: Install Allure CLI
        run: npm install -D allure-commandline

      # 5. Run Playwright tests
      - name: Run Playwright Tests
        run: npx playwright test --reporter=allure-playwright

      # 6. Generate Allure report
      - name: Generate Allure Report
        run: npx allure generate allure-results --clean -o allure-report

      # 7. Zip Allure Report
      - name: Zip Allure Report
        run: zip -r allure-report.zip allure-report/*

      # 8. Upload Allure report artifact
      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report.zip

      # 9. Extract summary from Allure results
      - name: Extract Allure Summary
        id: summary
        run: |
          TOTAL=$(grep -oP '"total":\s*\K\d+' allure-report/widgets/summary.json || echo 0)
          PASSED=$(grep -oP '"passed":\s*\K\d+' allure-report/widgets/summary.json || echo 0)
          FAILED=$(grep -oP '"failed":\s*\K\d+' allure-report/widgets/summary.json || echo 0)
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

      # 10. Send email with link to artifact
      - name: Send Email with Artifact Link
        if: always() && steps.run_tests.conclusion != 'skipped'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          from: ${{ secrets.EMAIL_USER }}
          to: "testing.vinaw@gmail.com"
          subject: "Allure Test Report"
          body: |
            Playwright Test Automation Finished

            Summary:
            Total tests: ${{ steps.summary.outputs.total }}
            Passed: ${{ steps.summary.outputs.passed }}
            Failed: ${{ steps.summary.outputs.failed }}

            Download full Allure report here: ${{ github.server_url }}/${{ github.repository }}/suites/${{ github.run_id }}/artifacts