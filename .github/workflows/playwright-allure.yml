name: Playwright + Allure CI with Email Summary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # Install Playwright Browsers
      - name: Install Playwright Browsers
        run: npx playwright install

      # 4. Run Playwright tests with Allure reporter
      - name: Run Playwright Tests
        run: npx playwright test --reporter=allure-playwright

      # 5. Generate Allure report
      - name: Generate Allure Report
        run: npx allure generate allure-results --clean -o allure-report

      # 6. Create zip of Allure report
      - name: Zip Allure Report
        run: zip -r allure-report.zip allure-report

      # 7. Extract summary from Allure results
      - name: Extract Allure Summary
        id: summary
        run: |
          TOTAL=$(grep -oP '"total":\s*\K\d+' allure-report/widgets/summary.json || echo 0)
          PASSED=$(grep -oP '"passed":\s*\K\d+' allure-report/widgets/summary.json || echo 0)
          FAILED=$(grep -oP '"failed":\s*\K\d+' allure-report/widgets/summary.json || echo 0)
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

      # 8. Send email with zip attachment & summary in body
      - name: Send Email with Allure Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: "Allure Test Report"
          body: |
            Playwright Test Automation Finished

            Summary:
            Total tests: ${{ steps.summary.outputs.total }}
            Passed: ${{ steps.summary.outputs.passed }}
            Failed: ${{ steps.summary.outputs.failed }}

            Report attached as allure-report.zip
          to: "testing.vinaw@gmail.com"
          attachments: "allure-report.zip"
